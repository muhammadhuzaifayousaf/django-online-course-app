<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Result</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

<div class="container py-5">
    <div class="card shadow text-center">
        <div class="card-body p-5">

            {% if submission %}
                <h1 class="text-success mb-3">Congratulations!</h1>

                <h2>{{ course.name }}</h2>

                <p class="lead mt-4">
                    Your exam score is:
                </p>

                <h1 class="display-3">
                    {{ submission.score }}%
                </h1>

                <p class="mt-4">
                    Exam Results
                </p>

                <a
                    href="{% url 'course_details' course.id %}"
                    class="btn btn-primary"
                >
                    Back to Course
                </a>
            {% else %}
                <h2>No exam submission found.</h2>

                <a
                    href="{% url 'course_details' course.id %}"
                    class="btn btn-primary"
                >
                    Back to Course
                </a>
            {% endif %}

        </div>
    </div>
</div>

</body>
</html>
